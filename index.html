<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Danışmanlar Kurulu v4.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Sohbetler</h2>
                <button id="newChatBtn" class="new-chat-btn">+</button>
            </div>
            <ul id="chatList" class="chat-list">
                <!-- Sohbetler buraya dinamik olarak eklenecek -->
            </ul>
        </aside>
        <main class="chat-area">
            <div id="messageContainer" class="message-container">
                <!-- Mesajlar buraya dinamik olarak eklenecek -->
            </div>
            <div class="input-area">
                <textarea id="userInput" class="user-input" placeholder="Mesajınızı yazın veya bir uzmana sorun (@teknik, @strateji, @finans)..."></textarea>
                <button id="sendBtn" class="send-btn">Gönder</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
